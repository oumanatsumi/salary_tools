# Project-wide Gradle settings.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+TieredCompilation -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1
android.nonFinalResIds=true
org.gradle.daemon.performance.disable-logging=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx256m,-XX:+UseSerialGC,-XX:MaxMetaspaceSize=160m
kotlin.incremental=false
